<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title><span data-i18n="popup_title_timesheet">Pointage Temps</span></title>
    <link rel="stylesheet" href="../../ui/components/custom-select.css">
    <link rel="stylesheet" href="popup.css?v=2">
</head>
<body>
    <div class="container">
        <div class="top-nav">
            <div class="nav-logo" style="display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1;">
                <div class="profile-switcher-wrapper" style="position: relative; display: flex; align-items: center;">
                    <img id="nav-favicon" src="" style="position: absolute; left: 8px; width: 14px; height: 14px; pointer-events: none; display: none;">
                    <select id="doli-active-profile" class="profile-switcher hidden">
                        <!-- Rempli dynamiquement en JS -->
                    </select>
                </div>
                <button type="button" id="btn-open-dolibarr" class="top-open-doli-btn hidden" data-i18n-title="nav_open_dolibarr_title" title="Ouvrir Dolibarr">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                </button>
                <div class="entity-switcher-wrapper" style="position: relative; display: flex; align-items: center;">
                    <select id="doli-active-entity" class="profile-switcher entity-switcher hidden" title="Entité / Société">
                        <!-- Rempli dynamiquement en JS -->
                    </select>
                </div>
                <span style="font-size: 13.5px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" data-i18n="popup_title_timesheet">Pointage Temps</span>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab" id="btn-top-options" data-i18n-title="editor_settings_title" style="padding: 6px 8px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </button>
            </div>
        </div>

        <div id="setup-warning" class="onboarding-container hidden">
            <div class="onboarding-hero">
                <div class="onboarding-brand">
                    <img src="../../icon128.png" alt="DoliSIRH" class="onboarding-logo">
                    <div>
                        <h2 class="onboarding-title"><span data-i18n="onboarding_title"></span></h2>
                        <p class="onboarding-desc"><span data-i18n="onboarding_desc"></span></p>
                    </div>
                </div>
            </div>

            <form id="onboarding-form" class="onboarding-form">
                <div class="onboarding-form-header">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0d9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                    <span data-i18n="onboarding_form_title"></span>
                </div>

                <div class="form-group">
                    <div class="onboarding-label-row">
                        <label for="onboarding-doli-url"><span data-i18n="onboarding_url_label"></span></label>
                        <a href="#" id="onboarding-open-doli-link" target="_blank" rel="noopener noreferrer" class="onboarding-doli-shortcut hidden"><span data-i18n="onboarding_open_doli"></span></a>
                    </div>
                    <input type="url" id="onboarding-doli-url" data-i18n-placeholder="onboarding_url_ph" required>
                    <small class="onboarding-hint"><span data-i18n="onboarding_url_hint"></span></small>
                </div>

                <div class="form-group">
                    <label for="onboarding-doli-login"><span data-i18n="opt_62"></span></label>
                    <input type="text" id="onboarding-doli-login" data-i18n-placeholder="opt_ph_102" required>
                </div>

                <div class="form-group">
                    <label for="onboarding-doli-password"><span data-i18n="opt_63"></span></label>
                    <input type="password" id="onboarding-doli-password" data-i18n-placeholder="opt_ph_103" required>
                </div>

                <div id="onboarding-status" class="onboarding-status hidden"></div>

                <button type="submit" id="btn-onboarding-connect" class="onboarding-btn-primary">
                    <span class="spinner"></span>
                    <span data-i18n="onboarding_btn_connect"></span>
                </button>
            </form>

            <div class="onboarding-footer">
                <button type="button" id="btn-open-options" class="onboarding-btn-secondary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span data-i18n="onboarding_btn_advanced"></span>
                </button>
            </div>
        </div>

        <!-- VUE TIMESHEET -->
        <div id="view-timesheet" class="tab-content hidden" style="padding: 12px 15px;">

            <!-- SETUP CONTAINER (onboarding si pas configuré) -->
            <div id="timesheet-setup-container" class="hidden" style="background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); padding: 16px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 15px;">
                <h3 style="color: #0f172a; font-size: 14px; margin-top: 0; margin-bottom: 6px; display: flex; align-items: center; gap: 6px;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3498db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    Bienvenue dans le suivi de temps
                </h3>
                <p style="font-size: 12px; color: #64748b; margin-bottom: 16px; line-height: 1.4;">On vous prend 1 minute pour la configuration :</p>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label style="font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 6px; display: block;">Choisissez votre projet ressources humaines :</label>
                    <div class="searchable-select-container" style="min-width: 0;">
                        <select id="time-setup-project" class="searchable-select hidden">
                            <option value="">Chargement des projets...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 12px;">
                    <label style="font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 6px; display: block;">Choisissez les tâches "Présences" :</label>
                    <div id="time-setup-presence-container" style="background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; max-height: 120px; overflow-y: auto; font-size: 12px; color: #475569; display: flex; flex-direction: column; gap: 4px;">
                        <span style="color: #94a3b8; font-style: italic;">Sélectionnez le projet d'abord</span>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 6px; display: block;">Choisissez les tâches "Absences" :</label>
                    <div id="time-setup-absence-container" style="background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; max-height: 120px; overflow-y: auto; font-size: 12px; color: #475569; display: flex; flex-direction: column; gap: 4px;">
                        <span style="color: #94a3b8; font-style: italic;">Sélectionnez le projet d'abord</span>
                    </div>
                </div>
                <button type="button" id="btn-save-time-setup" class="btn-submit-rocket" disabled style="background: #2ecc71; box-shadow: 0 4px 10px rgba(46,204,113,0.3);">
                    <span class="btn-text" style="display: flex; align-items: center; justify-content: center;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    </span>
                </button>
            </div>

            <!-- CONTENU PRINCIPAL -->
            <div id="timesheet-main-container">

                <!-- TABS MODE : Projet Standard | Présence/Absence -->
                <div class="ts-mode-tabs">
                    <button type="button" id="btn-mode-standard" class="ts-tab-btn">
                        <svg width="15" height="14" viewBox="0 0 640 512" fill="currentColor" style="flex-shrink:0;"><path d="M384 320H256c-17.67 0-32 14.33-32 32v128c0 17.67 14.33 32 32 32h128c17.67 0 32-14.33 32-32V352c0-17.67-14.33-32-32-32zM192 32c0-17.67-14.33-32-32-32H32C14.33 0 0 14.33 0 32v128c0 17.67 14.33 32 32 32h95.72l73.16 128.04C211.98 300.98 232.4 288 256 288h.28L192 175.51V128h224V64H192V32zM608 0H480c-17.67 0-32 14.33-32 32v128c0 17.67 14.33 32 32 32h128c17.67 0 32-14.33 32-32V32c0-17.67-14.33-32-32-32z"/></svg>
                        <span data-i18n="time_standard_project">Projet</span>
                    </button>
                    <button type="button" id="btn-mode-rh" class="ts-tab-btn ts-tab-active">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span data-i18n="time_hr_mode">Semaine</span>
                    </button>
                    <button type="button" id="btn-mode-monthly" class="ts-tab-btn">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <span data-i18n="time_monthly_mode">Mensuel</span>
                    </button>
                </div>

                <!-- BLOC INFO PROJET RH + COMPTEUR MENSUEL -->
                <div id="ts-hr-project-info" class="ts-project-info-block">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
                    <span id="ts-hr-project-label">—</span>
                </div>
                <div id="ts-monthly-counter" class="ts-monthly-block">
                    <span id="ts-monthly-label">Prévues <span id="ts-month-name">—</span></span>
                    <span id="ts-monthly-hours" class="ts-monthly-hours">—</span>
                </div>

                <!-- SÉLECTEUR DE SEMAINE -->
                <div id="ts-week-nav" class="ts-week-nav">
                    <button class="ts-week-arrow" id="ts-week-prev" title="Semaine précédente">&#8249;</button>
                    <div id="ts-week-days" class="ts-week-days"><!-- JS --></div>
                    <button class="ts-week-arrow" id="ts-week-next" title="Semaine suivante">&#8250;</button>
                </div>

                <!-- ═══════════════════════ MODE RH ═══════════════════════ -->
                <div id="timesheet-mode-rh">

                    <!-- Section Présence -->
                    <div class="ts-tasks-section">
                        <div class="ts-section-header">
                            <span class="ts-section-title">Présence</span>
                            <span id="ts-pres-stats" class="ts-section-stats"></span>
                        </div>
                        <div id="hr-presence-container" class="ts-task-cards">
                            <!-- Cartes générées en JS -->
                        </div>
                    </div>

                    <!-- Section Absence -->
                    <div class="ts-tasks-section">
                        <div class="ts-section-header">
                            <span class="ts-section-title">Absence</span>
                            <span id="ts-abs-stats" class="ts-section-stats"></span>
                        </div>
                        <div id="hr-absence-container" class="ts-task-cards">
                            <!-- Cartes générées en JS -->
                        </div>
                    </div>

                    <!-- Status message global -->
                    <div id="time-status" style="font-size:11px;text-align:center;margin-top:6px;font-weight:bold;color:#2ecc71;"></div>

                    <!-- Champs cachés utilisés par le JS -->
                    <input type="hidden" id="time-date" value="">
                    <input type="hidden" id="time-hr-task" value="">
                    <input type="hidden" id="time-hr-task-type" value="">
                </div>

                <!-- ═══════════════════════ MODE STANDARD ═══════════════════════ -->
                <div id="timesheet-mode-monthly" class="hidden">
                    <div class="ts-cal-header">
                        <button type="button" class="ts-week-arrow" id="ts-cal-prev" title="Mois précédent">&#8249;</button>
                        <div class="ts-cal-title-block">
                            <span id="ts-cal-month-title" class="ts-cal-month-title">—</span>
                            <span id="ts-cal-month-summary" class="ts-cal-month-summary"></span>
                        </div>
                        <button type="button" class="ts-week-arrow" id="ts-cal-next" title="Mois suivant">&#8250;</button>
                    </div>
                    <div class="ts-cal-legend">
                        <span class="ts-cal-legend-item"><span class="ts-cal-dot is-ok"></span>OK</span>
                        <span class="ts-cal-legend-item"><span class="ts-cal-dot is-ko"></span>Manque</span>
                        <span class="ts-cal-legend-item"><span class="ts-cal-dot is-grey"></span>À venir / 0h</span>
                        <span class="ts-cal-legend-item"><span class="ts-cal-badge-sample is-p">P</span>Présent</span>
                        <span class="ts-cal-legend-item"><span class="ts-cal-badge-sample is-a">A</span>Absent</span>
                    </div>
                    <div id="ts-cal-grid" class="ts-cal-grid">
                        <!-- Semaines generees en JS -->
                    </div>
                </div>

                <div id="timesheet-mode-standard" class="hidden" style="margin-top:10px;">
                    <div class="form-group">
                        <label for="time-project" class="std-label-with-stats">
                            <span data-i18n="time_project">Projet</span>
                            <span id="std-project-stats" class="std-inline-stats hidden"></span>
                        </label>
                        <div class="searchable-select-container" style="min-width:0;">
                            <select id="time-project" class="searchable-select hidden">
                                <option value=""><span data-i18n="time_select_project">Sélectionner un projet</span></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="std-task-header-row">
                            <label for="time-task" class="std-label-with-stats" style="margin-bottom:0;flex:1;">
                                <span data-i18n="time_task">Tâche</span>
                                <span id="std-task-stats" class="std-inline-stats hidden"></span>
                            </label>
                            <button type="button" id="btn-create-spj-task" class="std-create-spj-btn" data-i18n-title="std_create_spj_btn_title" title="Créer la tâche par défaut SPJ_" disabled>
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>
                        </div>
                        <div class="searchable-select-container" style="min-width:0;">
                            <select id="time-task" class="searchable-select hidden" disabled>
                                <option value=""><span data-i18n="time_select_task">Sélectionner une tâche</span></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group" style="display:flex;gap:10px;margin-top:8px;">
                        <div style="flex:1;">
                            <label for="time-date-std">Date</label>
                            <input type="date" id="time-date-std" required>
                        </div>
                        <div style="flex:1;">
                            <label for="time-duration-std">Durée (HH:MM)</label>
                            <input type="time" id="time-duration-std" value="00:15" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="time-note-std"><span data-i18n="time_note">Note / Commentaire</span> <span id="std-note-req-star" style="color:#ef4444;font-weight:700;">*</span></label>
                        <div class="std-note-action-row">
                            <textarea id="time-note-std" rows="2" placeholder="Ex: Réunion d'avancement.." style="flex:1;"></textarea>
                            <button type="button" id="btn-submit-time-std" class="ts-hr-star-btn std-save-disk-btn" data-i18n-title="time_save" title="Enregistrer le temps" disabled>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                            </button>
                        </div>
                    </div>
                    <div id="time-status-std" style="font-size:11px;text-align:center;margin-top:6px;font-weight:bold;"></div>
                    <div id="std-project-history" class="std-project-history hidden"></div>
                </div>

            </div><!-- END MAIN CONTAINER -->
        </div>
    </div>

    <script src="../../src/utils/i18n.js"></script>
    <script src="../../src/utils/errors.js"></script>
    <script type="module" src="popup.js"></script>
</body>
</html>
